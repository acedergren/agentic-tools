name: Skill Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate skill library
        run: npm run skills:validate

  install-smoke:
    runs-on: ubuntu-latest
    needs: validate-library
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install smoke test
        run: npm run skills:install-smoke

  secret-scan:
    runs-on: ubuntu-latest
    needs: validate-library
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Secret scan
        run: npm run skills:secrets-check

  oci-content-lint:
    runs-on: ubuntu-latest
    needs: validate-library
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned so CLI help output (and therefore lint results) only changes when we bump it.
      # If the install fails, the lint still runs the policy checks and skips the CLI checks.
      - name: Install OCI CLI
        continue-on-error: true
        run: pip install --quiet oci-cli==3.94.1

      - name: Lint OCI policies and CLI commands
        run: npm run skills:oci-lint
